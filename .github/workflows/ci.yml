# Builds, lints and tests MIS. Uses no secrets and deploys nothing.
name: CI

on:
  push:
    branches: [main, finish-mis]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  api:
    name: API — build & test (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore MIS.sln
      - run: dotnet build MIS.sln --no-restore -c Release -warnaserror:nullable
      - run: dotnet test MIS.sln --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: Check migrations match the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project ScrumDumpsterMolecularDiagnostic --context MedicalInformationDbContext
          dotnet ef migrations has-pending-model-changes --project ScrumDumpsterMolecularDiagnostic --context MedicalInformationAuthDbContext

  client:
    name: Client — typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:demo

  e2e:
    name: End-to-end (Playwright)
    needs: [api, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet build api/ScrumDumpsterMolecularDiagnostic
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npx playwright install --with-deps chromium
      - working-directory: client
        run: npx playwright test
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

  docker:
    name: Docker full stack (build + smoke test)
    needs: [api, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Throwaway SA password and JWT key generated on the runner; nothing is pushed anywhere.
      - run: scripts/dev-setup.sh --docker-only
      - run: docker compose --profile full up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS http://localhost:5029/api/health
          curl -fsS http://localhost:8080/ | grep -q "<title>MIS"
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8080/runs/deep-link | grep -q 200
          token=$(curl -fsS -X POST http://localhost:5029/api/Auth/Login -H 'content-type: application/json' \
            -d '{"username":"faculty","password":"Faculty123!"}' | jq -r .jwtToken)
          curl -fsS http://localhost:5029/api/AdminQCLots -H "Authorization: Bearer $token" | jq -e 'length > 0'
      - if: failure()
        run: docker compose --profile full logs --tail 200
